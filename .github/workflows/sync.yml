# Hourly: fetch new activities from Garmin, re-score, publish the page. Commits only when something changed.
name: sync
on:
  schedule:
    - cron: "7 * * * *"          # every hour at :07 (GitHub's schedule is best-effort, not exact)
  workflow_dispatch:
    inputs:
      all:
        description: "His whole Garmin history (and any track a past run missed). Before the scheme's start it shows, it never pays."
        type: boolean
        default: false
concurrency: { group: argo-data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: sync from Garmin
        env: { GARMINTOKENS: "${{ secrets.GARMINTOKENS }}", ALL: "${{ inputs.all }}" }
        run: python -m argo.sync $([ "$ALL" = "true" ] && echo --all)
      - name: score and build the page
        run: python -m argo.score --print
      - name: commit what changed
        run: |
          git config user.name "argo"
          git config user.email "argo@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "nothing new" || git commit -m "sync $(date -u +'%Y-%m-%d %H:%M')" -q
          git push
