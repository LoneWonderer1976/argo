# Ben's bounty form: Actions -> bounty -> Run workflow. The same lines as a reply on a bounty issue
# (approve, veto, reroll, bar 8, reward x2, target <key>, propose), several separated by ";".
# Week blank = the one waiting for a decision, else next week. The run's log prints the result.
name: bounty
on:
  workflow_dispatch:
    inputs:
      commands:
        description: "e.g. 'propose', 'approve', or 'target cycle_miles 10; reward x2; approve'"
        required: true
      week:
        description: "Monday of the bounty's week (blank = the one waiting, else next week)"
        required: false
concurrency: { group: argo-data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  bounty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: apply
        env:
          COMMANDS: "${{ inputs.commands }}"
          WEEK: "${{ inputs.week }}"
        run: |
          python -m argo.bounty ${WEEK:+--week "$WEEK"} --do "$COMMANDS" --apply
          python -m argo.score
      - name: commit
        env:
          COMMANDS: "${{ inputs.commands }}"
        run: |
          git config user.name "argo"
          git config user.email "argo@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "nothing changed" || git commit -m "bounty: $COMMANDS" -q
          git push
