# Sunday night: the week's statement to Ben, as a GitHub ISSUE -- GitHub emails him about it like
# any issue, and his reply of "paid" (from the email or on the issue) settles the week (paid.yml).
# Nothing to configure. If the SMTP secrets are set as well, a proper email goes out too.
name: statement
on:
  schedule:
    - cron: "45 20 * * 0"        # Sunday 20:45 UTC = 21:45 BST / 20:45 GMT
  workflow_dispatch:
    inputs:
      week:
        description: "Monday of the week to send (blank = last completed week)"
        required: false
concurrency: { group: argo-data, cancel-in-progress: false }
permissions: { contents: write, issues: write }
jobs:
  statement:
    runs-on: ubuntu-latest
    env:
      SMTP_USER: "${{ secrets.SMTP_USER }}"     # `secrets` is not allowed in a step's `if`; env is
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: sync from Garmin first, so a Sunday-afternoon ride is on the statement
        env: { GARMINTOKENS: "${{ secrets.GARMINTOKENS }}" }
        run: python -m argo.sync
      - name: score and build the page
        run: python -m argo.score
      - name: commit what changed
        run: |
          git config user.name "argo"
          git config user.email "argo@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "sync before the statement" -q
          git push
      - name: open the statement issue
        env:
          GH_TOKEN: "${{ github.token }}"
          PAGE_URL: "${{ vars.PAGE_URL }}"
        run: |
          TITLE=$(python -m argo.statement --issue-file body.md ${{ inputs.week && format('--week {0}', inputs.week) || '' }})
          gh issue create --title "$TITLE" --body-file body.md
      - name: and an email, if SMTP is set up
        if: ${{ env.SMTP_USER != '' }}
        env:
          SMTP_HOST: "${{ secrets.SMTP_HOST }}"
          SMTP_PORT: "${{ secrets.SMTP_PORT }}"
          SMTP_PASS: "${{ secrets.SMTP_PASS }}"
          MAIL_TO: "${{ secrets.MAIL_TO }}"
          PAGE_URL: "${{ vars.PAGE_URL }}"
          PAY_URL: "${{ github.server_url }}/${{ github.repository }}/issues"
        run: python -m argo.statement ${{ inputs.week && format('--week {0}', inputs.week) || '' }}

  # Then next week's bounty, drawn from Ben's menu and opened as its own issue (ARGO_BRIEF
  # "Bounties"). Nothing reaches Thomas's page until Ben replies "approve" (paid.yml's bounty job).
  # A week that already has one is left alone, so a re-run of the statement draws nothing.
  bounty:
    needs: statement
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }      # the branch's head: the statement job has pushed since
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: propose next week's bounty
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          TITLE=$(python -m argo.bounty --propose --issue-file bounty.md --apply)
          if [ -z "$TITLE" ]; then exit 0; fi
          git config user.name "argo"
          git config user.email "argo@users.noreply.github.com"
          git add data
          git commit -qm "bounty proposed: $TITLE"
          git push
          for n in $(gh issue list --state open --search 'in:title "Argo bounty"' --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Lapsed: next week's bounty has just been proposed." || true
          done
          gh issue create --title "$TITLE" --body-file bounty.md
