# Sunday night, just after midnight: the week's statement to Ben, as a GitHub ISSUE -- GitHub
# emails him about it like any issue, and his reply of "paid" (from the email or on the issue)
# settles the week (paid.yml).
# Nothing to configure. If the SMTP secrets are set as well, a proper email goes out too.
name: statement
on:
  schedule:
    # Monday 00:17 UTC = 01:17 BST / 00:17 GMT: always past midnight in the UK, so the week it
    # reports has ENDED (weeks.last_week). Sunday 20:45 was the old time: GitHub ran it late, and
    # when late was 23:37 and not after midnight it sent the week before again (18/10/2026).
    - cron: "17 0 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "Monday of the week to send (blank = last completed week)"
        required: false
concurrency: { group: argo-data, cancel-in-progress: false }
permissions: { contents: write, issues: write }
jobs:
  statement:
    runs-on: ubuntu-latest
    env:
      SMTP_USER: "${{ secrets.SMTP_USER }}"     # `secrets` is not allowed in a step's `if`; env is
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: sync from Garmin first, so a Sunday-afternoon ride is on the statement
        env: { GARMINTOKENS: "${{ secrets.GARMINTOKENS }}" }
        run: python -m argo.sync
      - name: score and build the page
        run: python -m argo.score
      - name: commit what changed
        run: |
          git config user.name "argo"
          git config user.email "argo@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "sync before the statement" -q
          git push
      - name: open the statement issue
        env:
          GH_TOKEN: "${{ github.token }}"
          PAGE_URL: "${{ vars.PAGE_URL }}"
        run: |
          TITLE=$(python -m argo.statement --issue-file body.md ${{ inputs.week && format('--week {0}', inputs.week) || '' }})
          if [ -z "$TITLE" ]; then exit 0; fi        # that week is already paid: nothing to send
          gh issue create --title "$TITLE" --body-file body.md
      - name: and an email, if SMTP is set up
        if: ${{ env.SMTP_USER != '' }}
        env:
          SMTP_HOST: "${{ secrets.SMTP_HOST }}"
          SMTP_PORT: "${{ secrets.SMTP_PORT }}"
          SMTP_PASS: "${{ secrets.SMTP_PASS }}"
          MAIL_TO: "${{ secrets.MAIL_TO }}"
          PAGE_URL: "${{ vars.PAGE_URL }}"
          PAY_URL: "${{ github.server_url }}/${{ github.repository }}/issues"
        run: python -m argo.statement ${{ inputs.week && format('--week {0}', inputs.week) || '' }}

  # Then this week's bounty -- the week starting that morning -- drawn from Ben's menu and opened as its
  # own issue (ARGO_BRIEF "Bounties"). Nothing reaches Thomas's page until Ben replies "approve"
  # (paid.yml's bounty job). A week that already has one is left alone, so a re-run of the
  # statement draws nothing. The hourly sync makes the same draw for the week it is in, so a
  # missed run is made up within the hour.
  bounty:
    needs: statement
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }      # the branch's head: the statement job has pushed since
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: propose this week's bounty, if it has none
        env:
          GH_TOKEN: "${{ github.token }}"
        run: bash .github/propose-bounty.sh
