<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Argo">
<title>Argo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="hero-top">
    <h1>⛵ Argo</h1>
    <span id="updated" class="muted"></span>
  </div>
  <div class="hero-main">
    <div class="big" id="week-gbp">£0.00</div>
    <div class="big-label">this week so far</div>
  </div>
  <div class="hero-row">
    <div><div class="stat" id="owed-gbp">£0.00</div><div class="stat-label">owed</div></div>
    <div><div class="stat" id="paid-gbp">£0.00</div><div class="stat-label">paid</div></div>
    <div><div class="stat" id="total-gbp">£0.00</div><div class="stat-label">earned ever</div></div>
  </div>
</header>

<main>
  <section id="trophies-section">
    <h2>Trophies <span id="trophy-count" class="muted"></span></h2>
    <div id="trophies" class="trophies"></div>
    <p id="hidden-note" class="muted small"></p>
  </section>

  <section>
    <h2>Weeks</h2>
    <div class="chart-wrap"><canvas id="weeks-chart" height="160"></canvas></div>
    <div id="weeks" class="weeks"></div>
  </section>

  <section id="steps-section" hidden>
    <h2>Steps <span id="steps-sub" class="muted"></span></h2>
    <div class="chart-wrap"><canvas id="steps-chart" height="150"></canvas></div>
    <p class="muted small" id="steps-note"></p>
  </section>

  <section>
    <h2>Activities</h2>
    <div class="filters">
      <div id="f-sport" class="chips" role="group" aria-label="sport"></div>
      <div class="f-row">
        <label class="f-field"><span>When</span><select id="f-when"></select></label>
        <label class="f-field"><span>Sort</span><select id="f-sort"></select></label>
      </div>
      <div id="f-dates" class="f-row" hidden>
        <label class="f-field"><span>From</span><input type="date" id="f-from"></label>
        <label class="f-field"><span>To</span><input type="date" id="f-to"></label>
      </div>
      <input type="search" id="f-q" class="f-q" placeholder="Search by name…" aria-label="search by name" autocomplete="off">
    </div>
    <div class="acts-summary"><span id="acts-summary"></span><button type="button" id="f-reset" class="linkbtn" hidden>Clear</button></div>
    <div id="activities" class="cards"></div>
    <button type="button" id="more" class="more" hidden></button>
    <p id="empty" class="muted" hidden>Nothing yet — go and do something!</p>
  </section>

  <section>
    <h2>Totals <span id="totals-sub" class="muted"></span></h2>
    <table id="sports" class="table"><thead><tr><th>sport</th><th>times</th><th>distance</th><th>climb</th><th>points</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>How it pays</h2>
    <table id="rates" class="table"><tbody></tbody></table>
    <p class="muted small" id="rates-note"></p>
  </section>
</main>

<div id="egg" class="egg" hidden>
  <div class="egg-inner">
    <div class="egg-burst">🏆</div>
    <div class="egg-kicker">You found an Easter egg!</div>
    <div id="egg-title" class="egg-title"></div>
    <div id="egg-message" class="egg-message"></div>
    <div id="egg-date" class="muted small"></div>
    <button id="egg-next" class="egg-btn">Brilliant!</button>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-inner">
    <button class="close" id="sheet-close" aria-label="close">✕</button>
    <div id="sheet-title" class="sheet-title"></div>
    <div id="sheet-sub" class="muted"></div>
    <div id="sheet-stats" class="sheet-stats"></div>
    <div id="map" class="map" hidden></div>
    <div id="sheet-flags" class="flags"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
